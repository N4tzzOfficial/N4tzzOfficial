name: 📊 GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # User
          user: n4tzzofficial
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta

          # Languages
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage, bytes

          # Isometric commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Stars
          plugin_stars: yes
          plugin_stars_limit: 4

          # Achievements
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact

          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_filter: issue, pr, star, commit, push

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization

          # Followup
          plugin_followup: yes
          plugin_followup_sections: repositories

          # Repositories
          plugin_repositories: yes
          plugin_repositories_featured: NzRouter, N4Kit, N4tzzAI
          plugin_repositories_skipped: n4tzzofficial

          # Habit
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: no